<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test • Türkçe Dil Değerlendirme</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="shell test-shell">
    <section class="card test-card">
      <header class="test-header">
        <div>
          <p class="eyebrow" id="form-label">TÜRKÇE DİL DEĞERLENDİRME</p>
          <h1 id="participant-label">Katılımcı</h1>
        </div>
        <div class="progress-meta">
          <span id="progress-text">1 / 10</span>
          <button id="exit-button" type="button" class="text-button">Çık</button>
        </div>
      </header>

      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div id="question-area" class="question-area"></div>
      <div id="save-message" class="notice" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
