<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DKT Girişi • Türkçe Dil Değerlendirme</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="shell">
    <section class="card hero">
      <p class="eyebrow">DKT PROJE</p>
      <h1>DKT Girişi</h1>
      <p class="lead">
        Bu alan yalnızca yetkili araştırmacı ve DKT kullanıcıları içindir.
      </p>

      <button id="github-login" type="button" class="primary">GitHub ile Giriş Yap</button>

      <div class="auth-divider"><span>veya</span></div>

      <form id="login-form" class="start-form">
        <label for="username">Kullanıcı adı</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />

        <label for="password">Şifre</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button id="login-button" type="submit" class="primary">Kullanıcı Adı ile Giriş Yap</button>
      </form>

      <div id="login-message" class="notice" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
